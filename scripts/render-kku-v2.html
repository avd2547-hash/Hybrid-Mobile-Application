    async function render() {
      const svgText = atob(SVG_B64);
      const blob = new Blob([svgText], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      await new Promise((ok, err) => { img.onload = ok; img.onerror = () => err(new Error('svg load failed')); img.src = url; });
      const ratio = img.width / img.height; // ~2.026 (โลโก้แบน กว้างกว่าสูง)

      function draw(size, bg) {
        const c = document.createElement('canvas');
        c.width = size; c.height = size;
        const g = c.getContext('2d');
        if (bg) { g.fillStyle = bg; g.fillRect(0, 0, size, size); }
        // โลโก้กว้าง ~76% ของ canvas กึ่งกลางทั้งแนวตั้งแนวนอน
        const w = size * 0.76;
        const h = w / ratio;
        g.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        return c.toDataURL('image/png');
      }

      const results = { icon: draw(1024, '#ffffff'), splash: draw(800, null) };

      // แสดงผลให้ตรวจสอบ
      document.body.innerHTML = `
        <div style="font-family:sans-serif;padding:12px;"><b>splash 800×800</b><br><img src="${results.splash}" style="width:320px;background:#fff;border:1px solid #ddd;"></div>
        <div style="font-family:sans-serif;padding:12px;"><b>icon 1024×1024</b><br><img src="${results.icon}" style="width:160px;background:#fff;border:1px solid #ddd;"></div>`;

      // ส่งไปเซิร์ฟเวอร์บันทึก
      for (const [filename, dataUrl] of [['splash-icon-kku.png', results.splash], ['icon-kku.png', results.icon]]) {
        const r = await fetch('http://127.0.0.1:8791/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename, dataUrl }),
        });
        const j = await r.json();
        console.log('saved', filename, j.ok);
      }
      document.title = 'DONE';
    }
    render().catch(e => { document.title = 'ERROR:' + e.message; document.getElementById('status').textContent = 'ERROR: ' + e.message; });
  </script>
